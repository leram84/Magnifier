name: Build Android APK (no cache)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Do not use gradle/actions/setup-gradle here: that action manages a Gradle
      # cache. Downloading a fresh distribution makes this workflow unambiguously
      # cache-free and avoids misleading "Caching ... was enabled" messages.
      - name: Install fresh Gradle 8.14.3 without a cache action
        run: |
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/gradle.zip" \
            https://services.gradle.org/distributions/gradle-8.14.3-bin.zip
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP/gradle"
          echo "$RUNNER_TEMP/gradle/gradle-8.14.3/bin" >> "$GITHUB_PATH"

      - name: Remove all previous build output
        run: rm -rf .gradle build app/build

      - name: Build debug APK without caches
        run: gradle --no-daemon --no-build-cache --rerun-tasks clean assembleDebug

      - name: Give APK an unmistakable versioned name
        run: cp app/build/outputs/apk/debug/app-debug.apk Magnifeye-v1.3-build-${{ github.run_number }}.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: magnifeye-v1.3-build-${{ github.run_number }}
          path: Magnifeye-v1.3-build-${{ github.run_number }}.apk
          if-no-files-found: error
          retention-days: 30
