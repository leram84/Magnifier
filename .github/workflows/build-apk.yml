name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Give APK an unmistakable versioned name
        run: cp app/build/outputs/apk/debug/app-debug.apk Magnifeye-v1.1-build-${{ github.run_number }}.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: magnifeye-v1.1-build-${{ github.run_number }}
          path: Magnifeye-v1.1-build-${{ github.run_number }}.apk
          if-no-files-found: error
          retention-days: 30
